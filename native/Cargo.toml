[package]
name = "mms_ferrite_native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
fxhash = "0.2"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[profile.release]
lto = true
codegen-units = 1
